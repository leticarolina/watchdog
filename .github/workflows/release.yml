name: Build and Release
on:
  push:
    tags:
      - 'v*'
jobs:
  release-watchdog:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Watchdog contract release'
      relative_path: '["contracts/watchdog-contract"]'
      package: 'watchdog-contract'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}